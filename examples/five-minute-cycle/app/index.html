<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行清单</title>
    <style>
      :root { color: #1d2733; background: #f4f7fb; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(560px, calc(100vw - 32px)); background: #fff; border: 1px solid #dce4ee; border-radius: 18px; box-shadow: 0 16px 40px rgba(43, 58, 75, .1); padding: 28px; }
      header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      h1 { font-size: 24px; margin: 0 0 6px; } p { color: #5c6b7b; margin: 0; line-height: 1.55; }
      button { border: 0; border-radius: 999px; padding: 10px 14px; background: #195db8; color: #fff; font: inherit; cursor: pointer; white-space: nowrap; }
      button[aria-pressed="true"] { background: #123a70; }
      ul { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 10px; }
      li { display: flex; justify-content: space-between; gap: 12px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; }
      .done { color: #167347; font-weight: 650; } .todo { color: #a65d00; font-weight: 650; }
      .empty { display: none; text-align: center; padding: 28px; border: 1px dashed #bdc9d8; border-radius: 12px; margin-top: 24px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>旅行清单</h1><p>出发前核对三项准备工作。</p></div>
        <button id="filter" type="button" aria-pressed="false">仅看已完成</button>
      </header>
      <ul id="items">
        <li data-done="true"><span>确认酒店入住时间</span><strong class="done">已完成</strong></li>
        <li data-done="false"><span>下载离线地图</span><strong class="todo">待完成</strong></li>
        <li data-done="true"><span>准备护照与证件复印件</span><strong class="done">已完成</strong></li>
      </ul>
      <p class="empty" id="empty">当前没有已完成项目。</p>
    </main>
    <script>
      const button = document.querySelector('#filter');
      const items = [...document.querySelectorAll('#items li')];
      const empty = document.querySelector('#empty');
      button.addEventListener('click', () => {
        const enabled = button.getAttribute('aria-pressed') !== 'true';
        button.setAttribute('aria-pressed', String(enabled));
        button.textContent = enabled ? '显示全部项目' : '仅看已完成';
        items.forEach((item) => { item.hidden = enabled && item.dataset.done !== 'true'; });
        empty.style.display = enabled && !items.some((item) => !item.hidden) ? 'block' : 'none';
      });
    </script>
  </body>
</html>
