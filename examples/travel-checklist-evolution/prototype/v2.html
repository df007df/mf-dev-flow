<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>旅行清单原型 v2</title>
    <style>
      :root { color: #172033; background: #eef3f9; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
      main { width: min(820px, 100%); background: #fff; border: 1px solid #d7e0eb; border-radius: 24px; padding: 36px; box-shadow: 0 24px 64px rgba(35, 55, 80, .12); }
      header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
      .eyebrow { margin: 0 0 8px; color: #6b4bb5; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 34px; } .intro { margin: 10px 0 0; color: #657386; }
      button { border: 0; border-radius: 999px; padding: 12px 18px; background: #673ab7; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button[aria-pressed="true"] { background: #412477; }
      .summary { margin: 24px 0 16px; padding: 14px 16px; border-radius: 14px; background: #f3effb; color: #3f2c67; font-weight: 700; }
      .groups { display: grid; gap: 18px; }
      section { border: 1px solid #dfe7f0; border-radius: 16px; padding: 18px; }
      section[hidden], li[hidden] { display: none; }
      h2 { margin: 0 0 12px; font-size: 18px; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      li { display: flex; justify-content: space-between; gap: 16px; padding: 14px; border-radius: 12px; background: #f8fafc; }
      .done { color: #14734a; } .todo { color: #a05b00; }
    </style>
  </head>
  <body>
    <main data-entry-id="trip-groups-default">
      <header>
        <div><p class="eyebrow">原型 v2</p><h1>旅行清单</h1><p class="intro">按出行阶段核对当前结果。</p></div>
        <button id="filter" type="button" aria-pressed="false">仅看已完成</button>
      </header>
      <p id="summary" class="summary" aria-live="polite">当前显示 4 项 · 已完成 3 项</p>
      <div class="groups">
        <section data-trip-group="before"><h2>出发前</h2><ul>
          <li data-trip-item data-done="true"><span>确认酒店入住时间</span><strong class="done">已完成</strong></li>
          <li data-trip-item data-done="false"><span>下载离线地图</span><strong class="todo">待完成</strong></li>
          <li data-trip-item data-done="true"><span>准备护照与证件复印件</span><strong class="done">已完成</strong></li>
        </ul></section>
        <section data-trip-group="during"><h2>旅途中</h2><ul>
          <li data-trip-item data-done="true"><span>保存紧急联系方式</span><strong class="done">已完成</strong></li>
        </ul></section>
      </div>
    </main>
    <script>
      const button = document.querySelector('#filter');
      const groups = [...document.querySelectorAll('[data-trip-group]')];
      const items = [...document.querySelectorAll('[data-trip-item]')];
      const summary = document.querySelector('#summary');
      const render = (completedOnly) => {
        items.forEach((item) => { item.hidden = completedOnly && item.dataset.done !== 'true'; });
        groups.forEach((group) => { group.hidden = !group.querySelector('[data-trip-item]:not([hidden])'); });
        const visible = items.filter((item) => !item.hidden);
        const completed = visible.filter((item) => item.dataset.done === 'true');
        summary.textContent = `当前显示 ${visible.length} 项 · 已完成 ${completed.length} 项`;
        button.setAttribute('aria-pressed', String(completedOnly));
        button.textContent = completedOnly ? '显示全部项目' : '仅看已完成';
      };
      button.addEventListener('click', () => render(button.getAttribute('aria-pressed') !== 'true'));
      render(false);
    </script>
  </body>
</html>
