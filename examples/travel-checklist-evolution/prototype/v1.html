<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行清单原型 v1</title>
    <style>
      :root { color: #172033; background: #eef3f9; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
      main { width: min(760px, 100%); background: #fff; border: 1px solid #d7e0eb; border-radius: 24px; padding: 36px; box-shadow: 0 24px 64px rgba(35, 55, 80, .12); }
      header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
      .eyebrow { margin: 0 0 8px; color: #3666a7; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 34px; }
      .intro { margin: 10px 0 0; color: #657386; }
      button { border: 0; border-radius: 999px; padding: 12px 18px; background: #1d5dab; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button[aria-pressed="true"] { background: #123866; }
      .result { margin: 24px 0 12px; color: #46566a; font-weight: 650; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
      li { display: flex; justify-content: space-between; gap: 16px; padding: 18px; border: 1px solid #dfe7f0; border-radius: 14px; background: #fbfcfe; }
      li[hidden] { display: none; }
      .done { color: #14734a; } .todo { color: #a05b00; }
    </style>
  </head>
  <body>
    <main data-entry-id="trip-list-default">
      <header>
        <div>
          <p class="eyebrow">原型 v1</p>
          <h1>旅行清单</h1>
          <p class="intro">出发前核对准备事项。</p>
        </div>
        <button id="filter" type="button" aria-pressed="false">仅看已完成</button>
      </header>
      <p id="result" class="result" aria-live="polite">显示 3 / 3 项</p>
      <ul id="items">
        <li data-trip-item data-done="true"><span>确认酒店入住时间</span><strong class="done">已完成</strong></li>
        <li data-trip-item data-done="false"><span>下载离线地图</span><strong class="todo">待完成</strong></li>
        <li data-trip-item data-done="true"><span>准备护照与证件复印件</span><strong class="done">已完成</strong></li>
      </ul>
    </main>
    <script>
      const button = document.querySelector('#filter');
      const items = [...document.querySelectorAll('[data-trip-item]')];
      const result = document.querySelector('#result');
      button.addEventListener('click', () => {
        const enabled = button.getAttribute('aria-pressed') !== 'true';
        button.setAttribute('aria-pressed', String(enabled));
        button.textContent = enabled ? '显示全部项目' : '仅看已完成';
        items.forEach((item) => { item.hidden = enabled && item.dataset.done !== 'true'; });
        result.textContent = `显示 ${items.filter((item) => !item.hidden).length} / ${items.length} 项`;
      });
    </script>
  </body>
</html>
